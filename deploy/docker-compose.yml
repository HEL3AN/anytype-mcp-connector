# Production stack: reverse proxy (TLS) -> connector (OAuth + MCP) -> anytype-cli (headless Anytype).
# The proxy is either the bundled Caddy (COMPOSE_PROFILES=caddy) or one already on the host (see nginx/).
# Usage: see docs/deploy.md. Run from this directory: `docker compose up -d`.
name: anytype-mcp

# Bounded container logs (Docker's json-file driver does not rotate by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  anytype:
    logging: *logging
    image: ${ANYTYPE_CLI_IMAGE:-ghcr.io/anyproto/anytype-cli:v0.4.0}
    command: ["serve", "--listen-address", "0.0.0.0:31012"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      # The JSON API only accepts Host headers it knows; the connector calls it as http://anytype:31012.
      ANYTYPE_API_ALLOWED_HOSTS: anytype
      # Sync over TCP (yamux) instead of QUIC/UDP. Servers often have small UDP buffers or filtered UDP,
      # which leaves the first sync stuck; set ANYTYPE_PREFER_TCP=false to use QUIC.
      # (The heart config field is spelled "PeferYamuxTransport".)
      ANYTYPE_PEFERYAMUXTRANSPORT: ${ANYTYPE_PREFER_TCP:-true}
    volumes:
      - anytype-data:/root/.anytype
      - anytype-config:/root/.config/anytype
    # Needs outbound internet to sync with the any-sync network.
    # No published ports: the API is only reachable from the connector.
    networks: [backend]

  connector:
    logging: *logging
    # Built from this checkout by default; set CONNECTOR_IMAGE=ghcr.io/... in .env to run a released
    # image instead (setup.sh/update.sh then pull it and never build).
    image: ${CONNECTOR_IMAGE:-anytype-mcp-connector:local}
    build: ..
    restart: unless-stopped
    depends_on:
      anytype:
        condition: service_healthy
    environment:
      ANYTYPE_API_URL: http://anytype:31012
      ANYTYPE_API_KEY: ${ANYTYPE_API_KEY:?set ANYTYPE_API_KEY in .env (scripts/setup.sh prints it)}
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in .env}
      # Exactly one proxy (Caddy) sits in front of the connector.
      TRUST_PROXY: "1"
      EXTRA_REDIRECT_URIS: ${EXTRA_REDIRECT_URIS:-}
      # Hosts allowed to serve OAuth Client ID Metadata Documents (comma-separated, "*" = any public host)
      CIMD_TRUSTED_HOSTS: ${CIMD_TRUSTED_HOSTS:-claude.ai,claude.com}
      # Optional: Google Search Console "HTML tag" token, so Google indexes the home page and its icon
      # (Claude shows connector icons from Google's favicon service).
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    # Published on loopback only, for a reverse proxy running on the host (nginx, ...).
    # With the bundled Caddy (COMPOSE_PROFILES=caddy) this port is not needed but harmless.
    ports:
      - "127.0.0.1:${CONNECTOR_PORT:-3040}:3000"
    # Least privilege: read-only root filesystem (writes go to /data and /tmp), no capabilities.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    volumes:
      - connector-data:/data
    networks: [backend, web]

  # Optional TLS reverse proxy for servers that don't run one: set COMPOSE_PROFILES=caddy in .env.
  caddy:
    logging: *logging
    profiles: [caddy]
    image: ${CADDY_IMAGE:-caddy:2.11-alpine}
    restart: unless-stopped
    depends_on: [connector]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]

networks:
  backend:
  web:

volumes:
  anytype-data:
  anytype-config:
  connector-data:
  caddy-data:
  caddy-config:

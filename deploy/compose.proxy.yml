# Optional overlay: route all outbound traffic of the stack through a SOCKS5 proxy (e.g. a VLESS/xray
# client) for networks where the Anytype sync nodes — and claude.ai, which serves Claude's OAuth client
# metadata documents — are blocked, throttled or geo-restricted.
#
# Enable in deploy/.env:
#   COMPOSE_FILE=docker-compose.yml:compose.proxy.yml
#   EGRESS_PROXY=socks5://host:port          # a proxy reachable from Docker containers
# or, if the proxy listens only on the host's loopback (127.0.0.1:10808):
#   COMPOSE_PROFILES=host-proxy               # add to existing profiles with a comma
#   HOST_PROXY_PORT=10808
#
# anytype and the connector share the network namespace of `egress`, where tun2socks sends all
# non-local traffic through the proxy. The connector reaches anytype on 127.0.0.1; the connector's
# port is published on `egress`.

services:
  egress:
    image: ${TUN2SOCKS_IMAGE:-xjasonlyu/tun2socks:v2.7.0}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      PROXY: ${EGRESS_PROXY:-socks5://${BACKEND_GATEWAY:-172.31.250.1}:${HOST_PROXY_BRIDGE_PORT:-10818}}
      LOGLEVEL: warning
    networks: [backend, web]
    ports:
      - "127.0.0.1:${CONNECTOR_PORT:-3040}:3000"

  # Exposes a proxy bound to the host's loopback on the backend network's gateway address, so `egress`
  # can reach it (Docker blocks containers from other bridges' addresses). Not reachable from outside.
  proxy-bridge:
    profiles: [host-proxy]
    image: ${SOCAT_IMAGE:-alpine/socat:1.8.1.3}
    restart: unless-stopped
    network_mode: host
    depends_on: [egress] # the backend bridge (and its gateway address) must exist first
    command:
      - TCP-LISTEN:${HOST_PROXY_BRIDGE_PORT:-10818},bind=${BACKEND_GATEWAY:-172.31.250.1},fork,reuseaddr
      - TCP:127.0.0.1:${HOST_PROXY_PORT:-10808}

  anytype:
    network_mode: service:egress
    networks: !reset null
    depends_on: [egress]

  connector:
    network_mode: service:egress
    networks: !reset null
    ports: !reset []
    environment:
      ANYTYPE_API_URL: http://127.0.0.1:31012

  # Only used with COMPOSE_PROFILES=caddy: the connector now lives in egress's namespace.
  caddy:
    environment:
      UPSTREAM: egress:3000

# Fixed subnet and interface name so the bridge can bind to a known gateway address and a host
# firewall rule can target it. With ufw:
#   sudo ufw allow in on br-anytype-mcp to 172.31.250.1 port 10818 proto tcp comment 'anytype-mcp egress'
networks:
  backend:
    driver_opts:
      com.docker.network.bridge.name: br-anytype-mcp
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.31.250.0/24}
          gateway: ${BACKEND_GATEWAY:-172.31.250.1}

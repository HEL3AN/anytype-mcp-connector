# Optional overlay: route headless Anytype's sync traffic through a SOCKS5 proxy (e.g. a VLESS/xray
# client) for networks where the Anytype sync nodes are blocked or throttled.
#
# Enable in deploy/.env:
#   COMPOSE_FILE=docker-compose.yml:compose.proxy.yml
#   EGRESS_PROXY=socks5://host:port          # a proxy reachable from Docker containers
# or, if the proxy listens only on the host's loopback (127.0.0.1:10808):
#   COMPOSE_PROFILES=host-proxy               # add to existing profiles with a comma
#   HOST_PROXY_PORT=10808
#
# anytype shares the network namespace of `egress`, where tun2socks sends all non-local traffic
# through the proxy. Traffic inside the Docker network (connector -> anytype API) stays direct.

services:
  egress:
    image: ${TUN2SOCKS_IMAGE:-xjasonlyu/tun2socks:v2.7.0}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      PROXY: ${EGRESS_PROXY:-socks5://172.17.0.1:${HOST_PROXY_BRIDGE_PORT:-10818}}
      LOGLEVEL: warning
    networks: [backend]

  # Exposes a proxy bound to the host's loopback on the docker0 address, so `egress` can reach it.
  # Only containers on this host can connect to it.
  proxy-bridge:
    profiles: [host-proxy]
    image: ${SOCAT_IMAGE:-alpine/socat:1.8.1.3}
    restart: unless-stopped
    network_mode: host
    command:
      - TCP-LISTEN:${HOST_PROXY_BRIDGE_PORT:-10818},bind=172.17.0.1,fork,reuseaddr
      - TCP:127.0.0.1:${HOST_PROXY_PORT:-10808}

  anytype:
    network_mode: service:egress
    networks: !reset null
    depends_on: [egress]
    environment:
      ANYTYPE_API_ALLOWED_HOSTS: egress

  connector:
    environment:
      ANYTYPE_API_URL: http://egress:31012

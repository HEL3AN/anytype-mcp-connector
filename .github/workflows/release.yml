name: Release

# Push a tag `vX.Y.Z` (matching package.json "version") to publish
# ghcr.io/<owner>/anytype-mcp-connector:{X.Y.Z, X.Y, latest} for linux/amd64 and linux/arm64
# with SBOM, provenance and a signed build attestation, and create a GitHub release.
# Verify an image: gh attestation verify oci://ghcr.io/hel3an/anytype-mcp-connector:<version> --owner HEL3AN
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      packages: write # push to GHCR
      id-token: write # keyless signing of the attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Anytype MCP connector
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          # No build cache for releases: every release image is built from scratch.
          no-cache: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke-test the published image
        run: |
          docker run -d --name check -p 3000:3000 --read-only --tmpfs /tmp --cap-drop ALL \
            -e OWNER_PASSWORD=release-check-password \
            -e ANYTYPE_API_KEY=unused \
            -e PUBLIC_URL=http://localhost:3000 \
            "$IMAGE:$VERSION"
          for _ in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:3000/healthz 2>/dev/null) && break
            sleep 1
          done
          echo "healthz: ${body:-<none>}"
          docker rm -f check >/dev/null
          echo "$body" | grep -q "\"version\":\"$VERSION\""

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$(cat <<EOF
          Image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64), digest \`$DIGEST\`

          Verify: \`gh attestation verify oci://$IMAGE:$VERSION --owner ${GITHUB_REPOSITORY_OWNER}\`
          EOF
          )"

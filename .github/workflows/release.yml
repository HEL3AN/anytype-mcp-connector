name: Release

# Push a tag `vX.Y.Z` (matching package.json "version") to publish
# ghcr.io/<owner>/anytype-mcp-connector:{X.Y.Z, X.Y, latest} for linux/amd64 and linux/arm64
# and create a GitHub release with generated notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Anytype MCP connector
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: |
          docker run -d --name check -p 3000:3000 \
            -e OWNER_PASSWORD=release-check-password \
            -e ANYTYPE_API_KEY=unused \
            -e PUBLIC_URL=http://localhost:3000 \
            "$IMAGE:$VERSION"
          for _ in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:3000/healthz 2>/dev/null) && break
            sleep 1
          done
          echo "healthz: ${body:-<none>}"
          docker rm -f check >/dev/null
          echo "$body" | grep -q "\"version\":\"$VERSION\""

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes "Image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64), digest \`${{ steps.build.outputs.digest }}\`"

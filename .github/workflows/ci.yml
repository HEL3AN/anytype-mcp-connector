name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^OWNER_PASSWORD=.*/OWNER_PASSWORD=ci-password-123/; s/^ANYTYPE_API_KEY=.*/ANYTYPE_API_KEY=ci/" .env
          docker compose config --quiet
      - name: Check shell scripts
        run: shellcheck deploy/*.sh
      - name: Check workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  derive-account-key:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/derive-account-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/derive-account-key/go.mod
          cache-dependency-path: tools/derive-account-key/go.sum
      - run: go vet ./...
      - run: go build ./...
      - name: Known-answer test (public BIP39 test phrase, not a real account)
        run: |
          out=$(echo "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" | go run .)
          echo "$out" | sha256sum | grep -q "^$EXPECTED " || { echo "derivation output changed"; exit 1; }
        env:
          EXPECTED: c8c730ee50d06b7fac440aa6076ee444396b67b67f27f5f683e0d4a6bf5ea5fe
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
